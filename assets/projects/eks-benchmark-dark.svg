<title id="title">EKS Cilium vs kube-proxy Benchmark</title>
<desc id="desc">Comparing eBPF service routing with the kube-proxy / iptables baseline. Terraform provisioning for EKS, VPC, subnets and managed node groups. Bash automation for workloads, health checks and Fortio benchmarks. Cluster and network observability with Prometheus, Grafana and Hubble.</desc>
